name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Select supported npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Select supported npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Select supported npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build and release gates
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Select supported npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ''

      - name: Check source and built map and homepage assets
        run: npm run check:assets

      - name: Smoke compiled migrations, seed and HTTP startup
        run: npm run test:smoke

      - name: Rehearse disposable database upgrades and recovery
        run: npm run test:database

      - name: Install matching Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Verify migrated API and Guest Admin Leader browser journeys
        run: npm run test:journeys -- --built
        env:
          RELEASE_EVIDENCE_DIR: output/playwright/r14-ci

      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-journeys-${{ github.sha }}
          path: output/playwright/r14-ci
          if-no-files-found: warn

services:
  - type: web
    name: uit-volunteer-map
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm exec --yes --package npm@11.19.1 -- npm ci --include=dev && npm run build && npm run check:assets
    startCommand: npm run start:production -w @uit-volunteer-map/backend
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SERVE_FRONTEND
        value: "true"
      - key: VITE_API_URL
        value: ""
      - key: IMPORT_XTN_2026
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PRODUCTION_ADMIN_USERNAME
        sync: false
      - key: PRODUCTION_ADMIN_EMAIL
        sync: false
      - key: PRODUCTION_ADMIN_PASSWORD
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
